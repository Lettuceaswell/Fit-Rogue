<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Fitness Roguelike v0.1</title>
<style>
  :root {
    --ink: #111;
    --mid: #555;
    --faint: #888;
    --rule: #ccc;
    --panel: #f0f0f0;
    --panel2: #e4e4e4;
    --bg: #fafafa;
    --bar-fill: #999;
    --bar-drain: #111;
    --bar-track: #ddd;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 17px; line-height: 1.4;
    -webkit-text-size-adjust: 100%;
  }
  #app { max-width: 520px; margin: 0 auto; padding: 14px 14px 40px; }

  h1 { font-size: 15px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
       margin: 0 0 10px; color: var(--mid); }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
  .stat { background: var(--panel); padding: 8px 10px; }
  .stat .k { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  .stat .v { font-size: 22px; font-weight: 700; }

  .rent { background: var(--ink); color: #fff; padding: 12px; margin-bottom: 14px; text-align: center; }
  .rent .k { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; opacity: .7; }
  .rent .v { font-size: 30px; font-weight: 700; }

  /* Energy bar — decorative, sits above the sliders, drains live as you drag */
  .ebar-wrap { margin-bottom: 16px; }
  .ebar-head { display: flex; justify-content: space-between; font-size: 11px;
               letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-bottom: 4px; }
  .ebar-head b { color: var(--ink); font-size: 13px; letter-spacing: 0; text-transform: none; }
  .ebar { position: relative; height: 22px; background: var(--bar-track); overflow: hidden; border: 1px solid var(--rule); }
  .ebar .fill  { position: absolute; top: 0; left: 0; height: 100%; background: var(--bar-fill); transition: width .12s linear; }
  .ebar .drain { position: absolute; top: 0; height: 100%; background: var(--bar-drain); transition: width .12s linear, left .12s linear; }
  .ebar .zeroline { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--rule); }

  .alloc { border-top: 2px solid var(--ink); padding-top: 12px; }
  .row { margin-bottom: 16px; }
  .rowhead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .rowhead .label { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
  .rowhead .yield { font-size: 13px; color: var(--mid); }
  .ctrl { display: flex; align-items: center; gap: 8px; }
  button {
    font-family: inherit; font-size: 22px; font-weight: 700;
    background: var(--panel2); color: var(--ink); border: 1px solid var(--rule);
    min-width: 56px; height: 52px; cursor: pointer;
  }
  button:active { background: var(--ink); color: #fff; }
  button:disabled { opacity: .35; cursor: default; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  input[type=range] { flex: 1; height: 52px; accent-color: #333; }
  .hrs { min-width: 62px; text-align: right; font-size: 22px; font-weight: 700; }
  .note { font-size: 12px; color: var(--faint); margin-top: 2px; }

  .sleep { background: var(--panel); padding: 10px; display: flex; justify-content: space-between; align-items: baseline; }
  .sleep .label { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
  .sleep .v { font-size: 22px; font-weight: 700; }

  .proj { border: 1px dashed var(--rule); padding: 10px; margin: 12px 0; font-size: 14px; color: var(--mid); }
  .proj div { display: flex; justify-content: space-between; }
  .proj b { color: var(--ink); }
  .proj b.down { color: #900; }

  .end { width: 100%; height: 62px; font-size: 18px; letter-spacing: .1em; background: var(--ink); color: #fff; border: none; }
  .end:active { background: var(--mid); }

  .log { margin-top: 20px; border-top: 1px solid var(--rule); padding-top: 10px; }
  .log h2 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin: 0 0 6px; font-weight: 700; }
  .log p { margin: 0 0 4px; font-size: 13px; color: var(--mid); }

  .over { text-align: center; padding-top: 30px; }
  .over .verdict { font-size: 40px; font-weight: 700; letter-spacing: .06em; }
  .over .detail { margin: 18px 0; font-size: 17px; }
  .over .detail div { margin-bottom: 6px; }
  .warn { color: #900; font-weight: 700; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   CONFIG — every balance number lives here. Change one at a time.
   ============================================================ */
const CONFIG = {
  HOURS_PER_DAY:              24,   // the whole day, for accounting only

  BASELINE_WORK_HOURS:        8,    // your day job. Fixed. Not a slider.
  BASELINE_DOLLARS:           16,   // what the day job pays, every round, no matter what
  BASELINE_ENERGY_COST:       4,    // energy the day job costs you, every round

  OVERTIME_MIN:               0,    // extra hours on top of the day job
  OVERTIME_MAX:                8,
  DOLLARS_PER_OVERTIME_HOUR:  4,
  ENERGY_PER_OVERTIME_HOUR:   1,

  ENERGY_PER_TRAIN_HOUR:      1,
  TRAIN_MAINTAIN_HOURS:       1,    // this many hours holds your Capacity steady
  TRAIN_POINTS_PER_HOUR:      1,    // progress earned per hour ABOVE maintenance
  TRAIN_POINTS_PER_LEVEL:     3,    // points needed to gain (or lose) a Capacity Level
  ENERGY_CAP_PER_LEVEL:       1,    // energy cap change per Capacity Level
  DETRAIN_POINTS_LOSS:        1,    // points lost per round when you train 0 hours

  PERSONAL_TIME_HOURS:        2,    // invisible — family/life, always taken off the top
  SLEEP_MIN:                  2,
  SLEEP_MAX:                  9,

  BASE_RECOVERY_PER_SLEEP_HOUR: 0.75, // energy returned per hour slept, at Level 1
  RECOVERY_PER_LEVEL:           0.10, // extra energy per sleep hour, per Capacity Level

  STARTING_DOLLARS:           40,
  STARTING_ENERGY_CAP:        12,
  STARTING_ENERGY:            12,

  RENT_START:                 20,
  RENT_GROWTH:                6,
  FINAL_ROUND:                20     // survive past this round to win
};
/* ============================================================ */

let S;

function newRun() {
  S = {
    round: 1,
    dollars: CONFIG.STARTING_DOLLARS,
    energy: CONFIG.STARTING_ENERGY,
    energyCap: CONFIG.STARTING_ENERGY_CAP,
    capacity: 1,
    points: 0,
    overtime: 0,
    train: 0,
    log: [],
    finished: false,
    won: false
  };
}

const rent = r => CONFIG.RENT_START + CONFIG.RENT_GROWTH * (r - 1);
const recoveryAt = lvl => CONFIG.BASE_RECOVERY_PER_SLEEP_HOUR + CONFIG.RECOVERY_PER_LEVEL * (lvl - 1);
const round1 = n => Math.round(n * 10) / 10;

// How many hours of overtime+train the day can actually hold, given the
// invisible personal-time tax and the fact sleep can't drop below its floor.
function maxDrawHoursByTime() {
  return Math.max(0, CONFIG.HOURS_PER_DAY - CONFIG.BASELINE_WORK_HOURS
                     - CONFIG.PERSONAL_TIME_HOURS - CONFIG.SLEEP_MIN);
}

// How many hours of overtime+train the current energy can actually fund.
function maxDrawHoursByEnergy() {
  const spendable = Math.max(0, S.energy - CONFIG.BASELINE_ENERGY_COST);
  return Math.floor(spendable); // 1 energy per hour, either lever
}

function drawCap() {
  return Math.max(0, Math.min(maxDrawHoursByTime(), maxDrawHoursByEnergy()));
}

function clampAlloc() {
  const cap = drawCap();
  const otMax = Math.min(CONFIG.OVERTIME_MAX, cap);
  if (S.overtime > otMax) S.overtime = otMax;
  if (S.overtime + S.train > cap) S.train = Math.max(0, cap - S.overtime);
}

// What the current dials would produce, without committing to it.
function preview() {
  const drawHours = S.overtime + S.train;
  const sleepRaw = CONFIG.HOURS_PER_DAY - CONFIG.BASELINE_WORK_HOURS
                   - CONFIG.PERSONAL_TIME_HOURS - drawHours;
  const sleep = Math.max(CONFIG.SLEEP_MIN, Math.min(CONFIG.SLEEP_MAX, sleepRaw));

  const earned = CONFIG.BASELINE_DOLLARS + S.overtime * CONFIG.DOLLARS_PER_OVERTIME_HOUR;

  // Training: 0h loses ground, 1h holds, 2h+ builds.
  let pts = S.points;
  if (S.train === 0) {
    pts -= CONFIG.DETRAIN_POINTS_LOSS;
  } else if (S.train > CONFIG.TRAIN_MAINTAIN_HOURS) {
    pts += (S.train - CONFIG.TRAIN_MAINTAIN_HOURS) * CONFIG.TRAIN_POINTS_PER_HOUR;
  }

  let lvl = S.capacity, cap = S.energyCap;
  while (pts >= CONFIG.TRAIN_POINTS_PER_LEVEL) {
    pts -= CONFIG.TRAIN_POINTS_PER_LEVEL; lvl += 1; cap += CONFIG.ENERGY_CAP_PER_LEVEL;
  }
  while (pts < 0 && lvl > 1) {
    pts += CONFIG.TRAIN_POINTS_PER_LEVEL; lvl -= 1; cap -= CONFIG.ENERGY_CAP_PER_LEVEL;
  }
  if (pts < 0) pts = 0; // floor out at Level 1, can't go negative forever

  const due = rent(S.round);
  const dollarsAfter = S.dollars + earned - due;

  const energyCostThisRound = CONFIG.BASELINE_ENERGY_COST
    + S.overtime * CONFIG.ENERGY_PER_OVERTIME_HOUR
    + S.train * CONFIG.ENERGY_PER_TRAIN_HOUR;
  const energyAfterActivity = Math.max(0, S.energy - energyCostThisRound);
  const nextEnergy = Math.min(cap, energyAfterActivity + sleep * recoveryAt(lvl));

  return { sleep, earned, pts, lvl, cap, due, dollarsAfter, energyCostThisRound, nextEnergy };
}

function setHours(which, val) {
  const cap = drawCap();
  if (which === 'overtime') {
    const otMax = Math.min(CONFIG.OVERTIME_MAX, cap - S.train);
    S.overtime = Math.max(CONFIG.OVERTIME_MIN, Math.min(val, otMax));
  } else {
    const trMax = cap - S.overtime;
    S.train = Math.max(0, Math.min(val, trMax));
  }
  render();
}

function endRound() {
  const p = preview();

  S.dollars += p.earned;
  S.points = p.pts;
  S.capacity = p.lvl;
  S.energyCap = p.cap;
  S.dollars -= p.due;

  S.log.unshift(
    'R' + S.round + ' \u00b7 OT ' + S.overtime + 'h / train ' + S.train + 'h / sleep ' + p.sleep + 'h' +
    ' \u00b7 +$' + p.earned + ' \u00b7 rent $' + p.due + ' \u00b7 left $' + S.dollars +
    ' \u00b7 Lv' + S.capacity + ' \u00b7 E' + round1(Math.max(0, p.nextEnergy))
  );
  S.log = S.log.slice(0, 6);

  if (S.dollars < 0) { S.finished = true; S.won = false; render(); return; }

  S.energy = p.nextEnergy;
  S.round += 1;
  S.overtime = 0; S.train = 0;

  if (S.round > CONFIG.FINAL_ROUND) { S.finished = true; S.won = true; }
  render();
}

function render() {
  const app = document.getElementById('app');

  if (S.finished) {
    app.innerHTML =
      '<div class="over">' +
        '<div class="verdict">' + (S.won ? 'SURVIVED' : 'BROKE') + '</div>' +
        '<div class="detail">' +
          '<div>Ended on round ' + Math.min(S.round, CONFIG.FINAL_ROUND) + ' of ' + CONFIG.FINAL_ROUND + '</div>' +
          '<div>Final Capacity Level ' + S.capacity + '</div>' +
          '<div>Dollars ' + S.dollars + '</div>' +
        '</div>' +
        '<button class="end" id="again">PLAY AGAIN</button>' +
        logHTML() +
      '</div>';
    document.getElementById('again').onclick = () => { newRun(); render(); };
    return;
  }

  clampAlloc();
  const p = preview();
  const cap = drawCap();
  const otMax = Math.min(CONFIG.OVERTIME_MAX, cap - S.train);
  const trMax = cap - S.overtime;
  const lowSleep = p.sleep <= CONFIG.SLEEP_MIN;
  const detraining = S.train === 0;

  app.innerHTML =
    '<h1>Fitness Roguelike v0.1</h1>' +

    '<div class="stats">' +
      stat('Round', S.round + ' / ' + CONFIG.FINAL_ROUND) +
      stat('Dollars', '$' + S.dollars) +
      stat('Capacity', 'Lv ' + S.capacity + '  (' + S.points + '/' + CONFIG.TRAIN_POINTS_PER_LEVEL + ')') +
      stat('Cap size', S.energyCap + ' max') +
    '</div>' +

    '<div class="rent"><div class="k">Rent due this round</div><div class="v">$' + p.due + '</div></div>' +

    energyBarHTML(p) +

    '<div class="alloc">' +
      hourRow('overtime', 'Overtime', S.overtime, otMax, '$' + CONFIG.DOLLARS_PER_OVERTIME_HOUR + ' / hr',
        'Day job (8h, $' + CONFIG.BASELINE_DOLLARS + ') already worked — this is on top.') +
      hourRow('train', 'Train', S.train, trMax,
        S.train === 0 ? 'losing ground' : (S.train === CONFIG.TRAIN_MAINTAIN_HOURS ? 'holding steady' : 'building'),
        '0h = Capacity slips. 1h = holds. 2h+ = grows.') +
      '<div class="sleep"><span class="label">Sleep</span>' +
        '<span class="v' + (lowSleep ? ' warn' : '') + '">' + p.sleep + ' hr</span></div>' +
    '</div>' +

    '<div class="proj">' +
      '<div><span>Earn this round</span><b>+$' + p.earned + '</b></div>' +
      '<div><span>Dollars after rent</span><b>$' + p.dollarsAfter + '</b></div>' +
      '<div><span>Energy next round</span><b>' + round1(p.nextEnergy) + ' / ' + p.cap + '</b></div>' +
      (p.cap !== S.energyCap ? '<div><span>Capacity</span><b class="' + (p.cap > S.energyCap ? '' : 'down') + '">Level ' + p.lvl + '</b></div>' : '') +
    '</div>' +

    '<button class="end" id="endbtn">END ROUND</button>' +
    logHTML();

  document.getElementById('endbtn').onclick = endRound;

  ['overtime', 'train'].forEach(k => {
    document.getElementById(k + '-minus').onclick = () => setHours(k, S[k] - 1);
    document.getElementById(k + '-plus').onclick  = () => setHours(k, S[k] + 1);
    const sl = document.getElementById(k + '-range');
    sl.oninput = e => setHours(k, parseInt(e.target.value, 10));
  });
}

function stat(k, v) {
  return '<div class="stat"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';
}

// Decorative bar: light fill = energy you have now. Dark overlay eats into it
// live as you drag the sliders, so you watch tonight's battery drain as you plan.
function energyBarHTML(p) {
  const cap = S.energyCap;
  const curPct = Math.max(0, Math.min(100, (S.energy / cap) * 100));
  const spend = Math.min(S.energy, p.energyCostThisRound);
  const spendPct = Math.max(0, Math.min(100, (spend / cap) * 100));
  const drainLeft = Math.max(0, curPct - spendPct);

  return '<div class="ebar-wrap">' +
    '<div class="ebar-head"><span>Energy</span><b>' + round1(S.energy) + ' / ' + cap + '</b></div>' +
    '<div class="ebar">' +
      '<div class="fill" style="width:' + curPct + '%"></div>' +
      '<div class="drain" style="left:' + drainLeft + '%; width:' + spendPct + '%"></div>' +
    '</div>' +
  '</div>';
}

function hourRow(id, label, val, max, yield_, note) {
  const hi = Math.max(0, max);
  return '<div class="row">' +
    '<div class="rowhead"><span class="label">' + label + '</span><span class="yield">' + yield_ + '</span></div>' +
    '<div class="ctrl">' +
      '<button id="' + id + '-minus"' + (val <= 0 ? ' disabled' : '') + '>&minus;</button>' +
      '<input type="range" id="' + id + '-range" min="0" max="' + hi + '" value="' + val + '" step="1">' +
      '<button id="' + id + '-plus"' + (val >= hi ? ' disabled' : '') + '>+</button>' +
      '<span class="hrs">' + val + 'h</span>' +
    '</div>' +
    (note ? '<div class="note">' + note + '</div>' : '') +
  '</div>';
}

function logHTML() {
  if (!S.log.length) return '';
  return '<div class="log"><h2>Recent rounds</h2>' +
    S.log.map(l => '<p>' + l + '</p>').join('') + '</div>';
}

newRun();
render();
</script>
</body>
</html>
